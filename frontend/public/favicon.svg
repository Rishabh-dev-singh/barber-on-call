<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#C58311"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#E5A93C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#E5A93C" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Gold Barber Shears -->
  <g transform="translate(14, 14) scale(1.5)" filter="url(#goldGlow)" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="6" cy="6" r="3" fill="#E5A93C" fill-opacity="0.2"/>
    <path d="M8.12 8.12 12 12"/>
    <path d="M20 4 8.12 15.88"/>
    <circle cx="6" cy="18" r="3" fill="#E5A93C" fill-opacity="0.2"/>
    <path d="M14.8 14.8 20 20"/>
  </g>
</svg>