# /etc/nginx/sites-available/barberoncall

server {
    listen 80;
    server_name barberoncall.site www.barberoncall.site api.barberoncall.site;

    client_max_body_size 25M;

    # Frontend React Single Page App
    location / {
        root /var/www/barberoncall/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django REST Framework APIs
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Files
    location /static/ {
        alias /var/www/barberoncall/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Media Files (Aadhaar uploads, portraits, certificates)
    location /media/ {
        alias /var/www/barberoncall/backend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
